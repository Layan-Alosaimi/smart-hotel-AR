<!DOCTYPE html>

<html lang=“ar” dir=“rtl”>

<head>

<meta charset=“UTF-8”>

<meta name=“viewport” content=“width=device-width, initial-scale=1.0”>

<title>Smart Hotel AR</title>

<style>

body {

  background: #102B3A;

  color: white;

  font-family: Arial;

  text-align: center;

  padding: 25px;

}

h1 { color: #D9B879; }

button {

  display: block;

  width: 90%;

  margin: 15px auto;

  padding: 18px;

  border: none;

  border-radius: 12px;

  font-size: 18px;

  background: #D9B879;

  color: #102B3A;

}

#info {

  margin-top: 25px;

  font-size: 20px;

}

</style>

</head>

<body>

<h1>🏨 Smart Hotel</h1>

<p>مرحباً بك في فندقنا الذكي</p>

<p>اكتشف خدمات الفندق</p>

<button onclick=“showInfo(‘🍽️ البوفيه متاح من 7 صباحاً إلى 10 صباحاً’)”>

خدمات البوفيه

</button>

<button onclick=“showInfo(‘🏊 المسبح متاح من 8 صباحاً إلى 9 مساءً’)”>

المسبح

</button>

<button onclick=“showInfo(‘🛎️ خدمة الغرف متاحة على مدار الساعة’)”>

خدمة الغرف

</button>

<button onclick=“showInfo(‘❄️ يمكنك التحكم بدرجة حرارة المكيف’)”>

المكيف

</button>

<div id=“info”>اختر إحدى الخدمات</div>

<script>

function showInfo(message) {

  document.getElementById(“info”).innerText = message;

}

</script>

</body>

</html>
