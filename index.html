
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOTEL PRIVA</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf8ff;
      color: #51446d;
      text-align: center;
    }

    header {
      background: #eee7ff;
      padding: 24px 15px;
      border-radius: 0 0 25px 25px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #7961a8;
    }

    header p {
      margin-bottom: 0;
      font-size: 17px;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .hotel-image {
      width: 100%;
      max-width: 450px;
      border-radius: 18px;
      box-shadow: 0 5px 18px #d8cbea;
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 350px;
      margin: 15px auto;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #a98bd5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-light {
      background: #eee7ff;
      color: #71569b;
      border: 1px solid #d6c5f1;
    }

    #ar-section {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: black;
    }

    #ar-section a-scene {
      width: 100%;
      height: 100%;
    }

    #services {
      display: none;
      position: absolute;
      z-index: 20;
      top: 15px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(250, 248, 255, 0.95);
      border-radius: 18px;
      max-height: 45%;
      overflow-y: auto;
    }

    #services h2 {
      margin: 5px;
      color: #71569b;
    }

    .service {
      background: #eee7ff;
      padding: 10px;
      margin: 8px 0;
      border-radius: 12px;
      color: #51446d;
      font-weight: bold;
    }

    #close-ar {
      position: absolute;
      z-index: 30;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
    }
  </style>
</head>

<body>

  <header>
    <h1>HOTEL PRIVA</h1>
    <p>مرحباً بك في فندق بريفا 💜</p>
  </header>

  <main class="container">
    <h2>اكتشف تجربة فندق بريفا</h2>

    <img
      class="hotel-image"
      src="./100D3D9A-E964-44E1-94B2-B59596A24379.PNG"
      alt="صورة فندق بريفا"
    >

    <a
      class="btn btn-light"
      href="./100D3D9A-E964-44E1-94B2-B59596A24379.PNG"
      download="HOTEL-PRIVA.PNG"
    >
      ⬇️ احفظ الصورة 😊
    </a>

    <button class="btn" onclick="startExperience()">
      📷 اضغط لعرض التجربة
    </button>
  </main>

  <section id="ar-section">

    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-camera position="0 0 0" look-controls="enabled: false">
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="hotel-target">

        <a-text
          value="HOTEL PRIVA"
          position="0 0.65 0"
          align="center"
          color="#a98bd5"
          width="2"
        ></a-text>

        <a-text
          value="Welcome to PRIVA"
          position="0 0.4 0"
          align="center"
          color="#ffffff"
          width="1.5"
        ></a-text>

      </a-entity>

    </a-scene>

    <div id="services">
      <h2>خدمات فندق بريفا 💜</h2>

      <div class="service">
        🍽️ البوفيه
        <p>استمتع بتجربة الطعام في فندق بريفا</p>
      </div>

      <div class="service">
        🏊 المسبح
        <p>منطقة مخصصة للاسترخاء والسباحة</p>
      </div>

      <div class="service">
        🛎️ خدمة الغرف
        <p>خدمات متاحة لراحة النزلاء</p>
      </div>

      <div class="service">
        ❄️ التكييف
        <p>تحكم بخيارات التكييف داخل الغرفة</p>
      </div>
    </div>

    <button class="btn" id="close-ar" onclick="closeExperience()">
      إغلاق التجربة
    </button>

  </section>

  <script>
    async function startExperience() {
      const section = document.getElementById("ar-section");
      const scene = document.getElementById("ar-scene");
      const target = document.getElementById("hotel-target");

      section.style.display = "block";

      if (!scene.hasAttribute("data-listeners")) {
        target.addEventListener("targetFound", function () {
          document.getElementById("services").style.display = "block";
        });

        target.addEventListener("targetLost", function () {
          document.getElementById("services").style.display = "none";
        });

        scene.setAttribute("data-listeners", "true");
      }

      if (!scene.hasLoaded) {
        await new Promise(resolve => {
          scene.addEventListener("loaded", resolve, { once: true });
        });
      }

      try {
        await scene.systems["mindar-image-system"].start();
      } catch (error) {
        alert("تعذر تشغيل الكاميرا. تأكدي من السماح باستخدام الكاميرا.");
        console.error(error);
      }
    }

    function closeExperience() {
      const scene = document.getElementById("ar-scene");

      scene.systems["mindar-image-system"].stop();

      document.getElementById("ar-section").style.display = "none";
      document.getElementById("services").style.display = "none";
    }
  </script>

</body>
</html>
