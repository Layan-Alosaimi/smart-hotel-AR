<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HOTEL PRIVA</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      background: #51446C;

      color: #FFFFFF;

      font-family: Arial, sans-serif;

      text-align: center;

    }

    header {

      padding: 20px;

    }

    h1 {

      color: #D8C8F0;

      font-size: 30px;

      letter-spacing: 2px;

      margin-bottom: 8px;

    }

    .subtitle {

      color: #F8F5FC;

      font-size: 17px;

    }

    #ar-container {

      width: 100%;

      height: 55vh;

      overflow: hidden;

    }

    #services {

      display: none;

      padding: 15px;

    }

    #services h2 {

      color: #D8C8F0;

    }

    .service-btn {

      display: block;

      width: 90%;

      max-width: 400px;

      margin: 12px auto;

      padding: 17px;

      border: none;

      border-radius: 14px;

      background: #D8C8F0;

      color: #51446C;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }

    .service-btn:active {

      background: #FFFFFF;

    }

    #info {

      background: #F8F5FC;

      color: #51446C;

      padding: 18px;

      margin: 15px auto;

      width: 90%;

      max-width: 400px;

      border-radius: 14px;

      min-height: 55px;

      font-size: 17px;

    }

    #status {

      padding: 10px;

      color: #F8F5FC;

    }

  </style>

</head>

<body>

  <header>

    <h1>HOTEL PRIVA</h1>

    <p class="subtitle">مرحباً بك في HOTEL PRIVA</p>

    <p class="subtitle">فندق بريفا</p>

    <p class="subtitle">

      وجّه الكاميرا نحو صورة الفندق لاكتشاف الخدمات

    </p>

  </header>

  <div id="ar-container">

    <a-scene

      mindar-image="imageTargetSrc: ./targets.mind;"

      color-space="sRGB"

      renderer="colorManagement: true, physicallyCorrectLights"

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false">

      <a-camera

        position="0 0 0"

        look-controls="enabled: false">

      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <a-plane

          color="#D8C8F0"

          opacity="0.9"

          position="0 0 0"

          width="1"

          height="0.5">

        </a-plane>

        <a-text

          value="HOTEL PRIVA"

          color="#51446C"

          align="center"

          position="0 0 0.01"

          width="2">

        </a-text>

      </a-entity>

    </a-scene>

  </div>

  <p id="status">

    في انتظار التعرف على صورة الفندق...

  </p>

  <div id="services">

    <h2>خدمات HOTEL PRIVA</h2>

    <button class="service-btn"

      onclick="showInfo('🍽️ البوفيه متاح من 7 صباحاً إلى 10 صباحاً')">

      خدمات البوفيه

    </button>

    <button class="service-btn"

      onclick="showInfo('🏊 المسبح متاح من 8 صباحاً إلى 9 مساءً')">

      المسبح

    </button>

    <button class="service-btn"

      onclick="showInfo('🛎️ خدمة الغرف متاحة على مدار الساعة')">

      خدمة الغرف

    </button>

    <button class="service-btn"

      onclick="showInfo('❄️ يمكنك التحكم بدرجة حرارة المكيف')">

      المكيف

    </button>

    <div id="info">

      اختر إحدى الخدمات

    </div>

  </div>

  <script>

    function showInfo(message) {

      document.getElementById("info").innerText = message;

    }

    const target = document.querySelector("[mindar-image-target]");

    target.addEventListener("targetFound", () => {

      document.getElementById("services").style.display = "block";

      document.getElementById("status").innerText =

        "تم التعرف على صورة الفندق بنجاح!";

    });

    target.addEventListener("targetLost", () => {

      document.getElementById("services").style.display = "none";

      document.getElementById("status").innerText =

        "وجّه الكاميرا نحو صورة الفندق";

    });

  </script>

</body>

</html>
